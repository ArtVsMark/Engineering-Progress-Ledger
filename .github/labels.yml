# Метки проекта — заготовка механизмов. Кладётся заходом подключения
# только в свободный путь; дальше файл ваш.
#
# Метка — вход механизма, а не украшение (064): её читает прогон или человек
# при разборе. Список разрешительный (068): метки, которой здесь нет, механизмы
# не знают. Применяет состав шаг `labels-sync` механизмов.
#
# ЗОНЫ ЖУРНАЛА — ПО ЕГО ПРЕДМЕТАМ (#22): архив снимков, база данных, страница
# и всё, чем журнал ведётся. Гейт разметки требует хотя бы одну зону на
# изменении, поэтому у каждого пути дерева есть зона. Образцы — `fnmatch`:
# `*` проходит и через `/`. Зоны данных и страницы объявлены до своих путей:
# их заведут задачи эпика #3, и зона встанет сама. Новый файл в корне, которого
# здесь нет, оставит изменение без зоны — гейт скажет это прямо.

# --- зоны: ставит шаг открытия по путям, уточняет автор ---------------------

- name: "area/snapshots"
  color: "5319E7"
  description: "Зона: архив снимков snapshots/ и их таблица в README — только дописываются"
  paths: ["snapshots/*", "README.md"]
- name: "area/data"
  color: "1D76DB"
  description: "Зона: база снимков и метрик data/, задание модели prompts/"
  paths: ["data/*", "prompts/*"]
- name: "area/site"
  color: "0E8A16"
  description: "Зона: страницы журнала site/, собираемые из базы"
  paths: ["site/*"]
- name: "area/core"
  color: "BFD4F2"
  description: "Зона: как журнал ведётся — свод, документы окна, конвейер, хуки, данные механизмов, скрипты"
  paths: [".github/*", ".claude/*", ".rules/*", ".pipeline.yml", ".gitignore", "AGENTS.md", "CLAUDE.md", "docs/*", "scripts/*"]

# --- очередь мержа ------------------------------------------------------------

- name: "automerge"
  color: "0e8a16"
  description: "Отдано очереди: ставит шаг открытия, снимает hold. Сольётся, как позеленеет"
- name: "hold"
  color: "d93f0b"
  description: "Стоп человека: не сливать и снять согласие, сколько бы зелёного ни было"
- name: "blocker"
  color: "b60205"
  description: "Слово владельца: источник 4 контура 1, идёт в очереди раньше плана и правил"
- name: "fix-main"
  color: "b60205"
  description: "Ставит человек: эта починка красной общей ветки идёт первой и не замораживается"
- name: "paused/main-red"
  color: "d93f0b"
  description: "Заморозка: общая ветка красна. Ставит и снимает шаг 9, кроме несущих fix-main"

# --- сценарий проверок: ставит шаг открытия, расширяет владелец ---------------
- name: "scope/text"
  color: "bfdadc"
  description: "Сценарий: тронут только текст — тесты по графу, кода не задето"
- name: "scope/code"
  color: "bfdadc"
  description: "Сценарий: тронут код — тесты, которые граф из кода назвал задетыми"
- name: "scope/flows"
  color: "bfdadc"
  description: "Сценарий: тронуты прогоны или действия — полный набор"
- name: "scope/full"
  color: "bfdadc"
  description: "Сценарий: тронуто общее или неизвестное — полный набор; владелец ставит, чтобы расширить"

# --- источник работы: ставит очередь, читает человек --------------------------

- name: "source/0"
  color: "b60205"
  description: "Источник 0: чинит красное — общую ветку или открытое изменение"
- name: "source/1"
  color: "fbca04"
  description: "Источник 1: конфликт слияния (виден только у головы очереди)"
- name: "source/2"
  color: "fbca04"
  description: "Источник 2: красная проверка на своём изменении"
- name: "source/3"
  color: "0e8a16"
  description: "Источник 3: снимает находку внешнего взгляда, пережившую слияние"
- name: "source/4"
  color: "0e8a16"
  description: "Источник 4: слово владельца"
- name: "source/5"
  color: "c5def5"
  description: "Источник 5: долг по правилам каталога"
- name: "source/6"
  color: "c5def5"
  description: "Источник 6: план"

# --- группа строки плана: ставит человек, раскладывает сборщик ---------------

- name: "plan/waits-owner"
  color: "d4c5f9"
  description: "План, раздел 4: ждёт решения владельца — окно её не берёт"
- name: "plan/waits-release"
  color: "bfdadc"
  description: "План, раздел 4: остаток — проверка на выпуске; метку снимает выпуск"
- name: "plan/recurring"
  color: "c2e0c6"
  description: "План, раздел 4: повторяющееся действие; событие повтора — в теле задачи"
- name: "plan/waits-date"
  color: "fef2c0"
  description: "План, раздел 4: копим данные до даты из тела задачи, работа — после неё"
- name: "plan/waits-neighbour"
  color: "f9d0c4"
  description: "План, раздел 6: ждёт действия соседа; его адрес — в теле задачи"

# --- род задачи: ставит автор ------------------------------------------------
- name: "epic"
  color: "8B5CF6"
  description: "Сводная задача: состав дочерними, сама работой не является"
  kind: true
- name: "bug"
  color: "d73a4a"
  description: "Дефект: поведение расходится с обещанным"
  kind: true
- name: "enhancement"
  color: "0e8a16"
  description: "Новое поведение"
  kind: true
- name: "documentation"
  color: "0075ca"
  description: "Текст, а не механизм: договор, свод, витрина"
  kind: true
- name: "tech-debt"
  color: "fbca04"
  description: "Долг: работает, но мешает менять"
  kind: true

