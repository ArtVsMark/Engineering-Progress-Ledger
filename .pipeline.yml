# SPDX-License-Identifier: MIT — https://github.com/ArtVsMark/Engineering-Pipeline-Mechanisms
schema: 4
contract: ">=0.14,<0.15"

checks:
  "attribution / attribution": required
  "debt / debt":
    class: advisory
    why: "остаток долга слияния не держит, но виден на каждом изменении"
    addressee: none
  "journal / journal":
    class: off
    why: "выпуски у журнала будут (#23), фрагменты уже ведутся в changelog.d/; обязательным шаг станет после ответа каталогу (#19): его проверка check_rule_birth без .rules/bindings.json отказывает, а род находок у журнала уже на пороге"
  "lint / lint":
    class: off
    why: "своего кода на Python в журнале нет: журнал хранит HTML-снимки, а хуки окна, положенные заходом, судит поставщик своим линтом"
  "pipeline / pipeline": required
  "pr-meta / pr-meta": required
  "rulebook-fresh / rulebook-fresh": required
  "snapshots": required
  "window-lifetime / window-lifetime": required
  "automerge / automerge":
    class: advisory
    why: "это само слияние, а не проверка перед ним"
    addressee: none
  "review / map":
    class: advisory
    why: "собирает карту для взгляда; не собралась — взгляд идёт без неё"
    addressee: none
  "review / review":
    class: advisory
    why: "внешний взгляд слияния не держит, находки живут в реестре находок"
    addressee: none
  "review / findings":
    class: advisory
    why: "запись находок слияния не держит"
    addressee: none
  "review / sweep":
    class: advisory
    why: "снимает с реестра разобранное по слитым изменениям; на голове изменения предмета нет"
    addressee: none
  "review / verify":
    class: advisory
    why: "проверяет премису одной находки по кнопке; слияния не касается"
    addressee: none
  "review / late-queue":
    class: advisory
    why: "очередь позднего взгляда по слитому; на голове изменения предмета нет"
    addressee: none
  "review / late-look":
    class: advisory
    why: "поздний взгляд идёт по слитому, а не на изменении"
    addressee: none
  "record / skills":
    class: advisory
    why: "запись вызовов навыков окна слияния не держит"
    addressee: none
  "digest / skills":
    class: advisory
    why: "сводка навыков идёт по расписанию, а не на изменении"
    addressee: none
  "task-items / task-items":
    class: advisory
    why: "разбор пунктов задачи слияния не держит"
    addressee: none
beyond_the_change:
  "agent-pr / agent-pr": unreviewed
  "attribution-history / attribution-history": unreviewed
  "ci-complete-wake / ci-complete-wake": unreviewed
  "respond / respond": unreviewed
  "intercept / intercept": unreviewed
  "drift / drift": unreviewed
  "facts / facts": unreviewed
  "hail / hail": unreviewed
  "apply / apply": unreviewed
  "main-red / main-red": unreviewed
  "test-next / test-next": unreviewed
  "release / release": unreviewed
  "compare / compare": unreviewed
  "runs-series / runs-series": unreviewed
  "schedules-seen / schedules-seen": unreviewed
  "stuck-prs / stuck-prs": unreviewed
  "verify-queue / verify-queue": unreviewed
  "work-plan / work-plan": unreviewed

# Что механизм поставщика сделал у вас не так — записью, а не прозой в трекере
# (навык `tell-the-supplier`, форма — договор поставщика, раздел `feedback:`).
feedback:
  version: 1
  records:
    - slug: floor-without-pyyaml
      mechanism: .claude/hooks/install_floor.sh
      version: v1.13.0
      kind: rework
      measured: "запускатель `.claude/mechanisms.sh` требует от интерпретатора планки `pyyaml`, а установка ставит `python3.14` без него: в облачном окне журнала 29.10.2026 `bash .claude/mechanisms.sh paths.py roles` падает `ModuleNotFoundError: yaml`, с системным `python3` 3.13 — `SyntaxError` (PEP 758); журнал собрал окружение планки с `pyyaml` слотом своего `session-start.sh`; у поставщика — ArtVsMark/Engineering-Pipeline-Mechanisms#1771"
      trace: ArtVsMark/Engineering-Progress-Ledger#20
    - slug: labels-description-limit
      mechanism: scripts/labels.py
      version: v1.14.0
      kind: false-pass
      measured: "разбор `.github/labels.yml` не проверяет предел площадки на длину описания метки (100 знаков): у журнала описание `area/core` было 110 знаков, гейты изменения EPL #29 зелёные, а `labels-sync` (`apply / apply`) падал `PATCH …/labels/area%2Fcore → 422` на каждом толчке в `main` с 29.10.2026 по 30.10.2026 (прогоны 40906438867, 41009920613)"
      trace: ArtVsMark/Engineering-Progress-Ledger#22
    - slug: version-file-collision
      mechanism: scripts/pipeline_checks.py
      version: v1.13.0
      kind: false-refusal
      measured: "`contract_of` берёт `CONTRACT_VERSION` из дерева потребителя, когда поставщик не опознан, — а в сводной проверке `ci-complete` он не опознаётся; журнал завёл `CONTRACT_VERSION` 0.1.0 своим номером выпуска (EPL #32), и `ci-complete` покраснел: «контракт механизмов 0.1.0 вне объявленного диапазона >=0.14,<0.15»; путь `paths.VERSION` таблицей `paths:` не переназначается, а шаг выпуска ведёт номер именно в нём — своего номера у потребителя с выпусками сейчас нет; у поставщика — ArtVsMark/Engineering-Pipeline-Mechanisms#1774"
      trace: ArtVsMark/Engineering-Progress-Ledger#23
    - slug: preflight-bare-python
      mechanism: scripts/preflight.py
      version: v1.13.0
      kind: false-refusal
      measured: "предполётная ставит первой в `PATH` папку интерпретатора `PYTHON` и зовёт блоки шагов голым `python`; при `PYTHON=python3.14` из `/usr/local/bin`, где `python` — системный 3.13, шаги краснеют `SyntaxError: multiple exception types must be parenthesized` (замер окна EPL 29.10.2026: 16 красных и 14 строк `SyntaxError` против 3 красных выключенных проверок в venv планки); журнал обходит venv планки в слоте `session-start.sh`; у поставщика — ArtVsMark/Engineering-Pipeline-Mechanisms#1767"
      trace: ArtVsMark/Engineering-Progress-Ledger#20
    - slug: schedules-seen-cron-forms
      mechanism: scripts/schedules_seen.py
      version: v1.13.0
      kind: partial
      measured: "`expected_between` не разбирает 3 из 8 кронов прогонов журнала — `41 5,17 * * *` (список часов), `37 5 * * 1` и `29 6 * * 1` (день недели) — и отвечает `NotRun`, а обход идёт по всем объявленным и падает на первом; поэтому `.rules/schedules.json` журнал не заводит; у поставщика — ArtVsMark/Engineering-Pipeline-Mechanisms#1768"
      trace: ArtVsMark/Engineering-Progress-Ledger#20
    - slug: kit-without-gitignore
      mechanism: scripts/onboard.py
      version: v1.13.0
      kind: rework
      measured: "хук `.claude/hooks/skill_log.sh` (код — `skill_log.py`) пишет `.claude/state/skill-runs.jsonl`, по своей докстроке — под `.gitignore`, а заход подключения `.gitignore` не кладёт: после первого вызова навыка в дереве журнала появился неотслеживаемый файл, и стоп-хук окна требовал его закоммитить; журнал завёл `.gitignore` сам; у поставщика — ArtVsMark/Engineering-Pipeline-Mechanisms#1769"
      trace: ArtVsMark/Engineering-Progress-Ledger#20
